<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student CGPA Calculator</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background: linear-gradient(to right,#4facfe,#00f2fe);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial, sans-serif;
        }

        .calculator-box{

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 6px 20px rgba(0,0,0,0.2);

            width:100%;

            max-width:500px;

            animation:fadeIn 1s ease;
        }

        h1{

            text-align:center;

            margin-bottom:25px;

            color:#0d6efd;

            font-weight:bold;
        }

        .btn-custom{

            width:100%;

            font-size:18px;

            font-weight:bold;
        }

        #result{

            margin-top:25px;

            font-size:24px;

            font-weight:bold;

            text-align:center;

            color:green;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="calculator-box">

        <h1>Student CGPA Calculator</h1>

        <div class="mb-3">

            <label class="form-label">
                Subject 1 GPA
            </label>

            <input type="number"
                   class="form-control"
                   id="sub1"
                   placeholder="Enter GPA"
                   min="0"
                   max="10">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Subject 2 GPA
            </label>

            <input type="number"
                   class="form-control"
                   id="sub2"
                   placeholder="Enter GPA"
                   min="0"
                   max="10">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Subject 3 GPA
            </label>

            <input type="number"
                   class="form-control"
                   id="sub3"
                   placeholder="Enter GPA"
                   min="0"
                   max="10">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Subject 4 GPA
            </label>

            <input type="number"
                   class="form-control"
                   id="sub4"
                   placeholder="Enter GPA"
                   min="0"
                   max="10">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Subject 5 GPA
            </label>

            <input type="number"
                   class="form-control"
                   id="sub5"
                   placeholder="Enter GPA"
                   min="0"
                   max="10">

        </div>

        <button class="btn btn-primary btn-custom"
                onclick="calculateCGPA()">

            Calculate CGPA

        </button>

        <div id="result"></div>

    </div>

    <script>

        function calculateCGPA(){

            let s1 = parseFloat(document.getElementById("sub1").value) || 0;

            let s2 = parseFloat(document.getElementById("sub2").value) || 0;

            let s3 = parseFloat(document.getElementById("sub3").value) || 0;

            let s4 = parseFloat(document.getElementById("sub4").value) || 0;

            let s5 = parseFloat(document.getElementById("sub5").value) || 0;

            let cgpa = (s1 + s2 + s3 + s4 + s5) / 5;

            document.getElementById("result").innerHTML =

                "Your CGPA is : " + cgpa.toFixed(2);

        }

    </script>

</body>

</html>
